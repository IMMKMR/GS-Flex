<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowSphere™ FLEX — Realistic Interactive Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',sans-serif;
  background:#05070a;
  display:flex;justify-content:center;align-items:center;
}

/* ── Container ── */
.sim{
  position:relative;width:100vw;height:100vh;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}
.sim-img{
  position:absolute;
  max-width:100%;max-height:100%;
  object-fit:contain;
  z-index:1;
}

/* SVG overlay */
.overlay-svg{
  position:absolute;z-index:10;pointer-events:none;
}

/* ── Clickable valve hit areas ── */
.valve-hit{cursor:pointer;pointer-events:all;}
.valve-hit:hover .valve-ring{stroke-width:3;filter:url(#glowBlue);}

/* ── Controls Panel ── */
.panel{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;gap:14px;align-items:center;
  background:rgba(10,12,18,0.7);backdrop-filter:blur(24px) saturate(1.8);
  padding:12px 24px;border-radius:60px;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 12px 40px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
}
.btn{
  padding:12px 26px;border-radius:30px;border:none;
  font-family:'Inter',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .2s cubic-bezier(0.2,0,0,1);
  text-transform:uppercase;letter-spacing:1.4px;
  display:flex;align-items:center;gap:8px;
}
.btn-start{background:linear-gradient(135deg,#00d97e,#00b368);color:#fff;
  box-shadow:0 6px 20px rgba(0,217,126,0.25), inset 0 1px 1px rgba(255,255,255,0.3);}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,217,126,0.4), inset 0 1px 1px rgba(255,255,255,0.3);}
.btn-start.running{background:linear-gradient(135deg,#00b368,#008c4f);
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.3);transform:none;}
.btn-stop{background:transparent;color:#ff4757;border:1.5px solid rgba(255,71,87,0.5);padding:10.5px 24.5px;}
.btn-stop:hover{background:rgba(255,71,87,0.1);border-color:#ff4757;}
.btn-reset{background:transparent;color:rgba(255,255,255,0.6);border:1.5px solid rgba(255,255,255,0.15);padding:10.5px 20px;}
.btn-reset:hover{color:#fff;border-color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.05);}

/* ── Status Badge ── */
.badge{
  position:fixed;top:24px;right:30px;z-index:100;
  background:rgba(10,12,18,0.6);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.06);
  padding:10px 20px;border-radius:30px;
  color:rgba(255,255,255,0.6);font-size:13px;font-weight:600;letter-spacing:0.5px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
  transition:all .4s ease;
}
.badge.active{border-color:rgba(0,217,126,0.3);color:#fff;background:rgba(10,12,18,0.8);}
.badge-dot{width:8px;height:8px;border-radius:50%;background:#555;transition:all .4s ease;}
.badge.active .badge-dot{background:#00d97e;box-shadow:0 0 10px #00d97e, 0 0 20px rgba(0,217,126,0.5);}

/* ── Data Dashboard ── */
.dash{
  position:fixed;top:24px;left:30px;z-index:100;
  display:flex;flex-direction:column;gap:8px;
  opacity:0;transition:opacity .6s cubic-bezier(0.2,0,0,1);pointer-events:none;
  transform:translateX(-20px);
}
.dash.show{opacity:1;pointer-events:all;transform:translateX(0);}
.dash-card{
  background:rgba(10,12,18,0.65);backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid rgba(255,255,255,0.05);
  padding:10px 16px;border-radius:16px;
  color:rgba(255,255,255,0.9);font-size:12px;font-weight:500;
  display:flex;align-items:center;gap:14px;min-width:180px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
  transition:transform .2s, border-color .3s;
}
.dash-card:hover{transform:translateX(5px);border-color:rgba(255,255,255,0.15);background:rgba(20,24,36,0.75);}
.dash-icon{font-size:18px;width:24px;text-align:center;}
.dash-label{font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.dash-val{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:#00d97e;}
.dash-val.blue{color:#0af;}
.dash-val.orange{color:#ffa940;}
.dash-val.purple{color:#b46eff;}

/* ── Valve Tooltips ── */
.valve-tooltip{
  position:fixed;z-index:200;
  background:rgba(10,12,18,0.9);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.15);
  padding:10px 16px;border-radius:12px;
  color:white;font-size:12px;font-weight:600;letter-spacing:0.5px;
  pointer-events:none;opacity:0;transition:opacity .2s;
  white-space:nowrap;
  box-shadow:0 12px 32px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<div class="valve-tooltip" id="tooltip"></div>

<div class="badge" id="badge"><div class="badge-dot"></div><span id="badgeTxt">System Idle</span></div>

<div class="dash" id="dash">
  <div class="dash-card"><div class="dash-icon">💧</div><div><div class="dash-label">Water Flow</div><div class="dash-val blue" id="dFlow">0.0 L/min</div></div></div>
  <div class="dash-card"><div class="dash-icon">🧪</div><div><div class="dash-label">EC Level</div><div class="dash-val" id="dEC">0.0 mS/cm</div></div></div>
  <div class="dash-card"><div class="dash-icon">⚗️</div><div><div class="dash-label">pH Level</div><div class="dash-val purple" id="dPH">0.0</div></div></div>
  <div class="dash-card"><div class="dash-icon">🌡️</div><div><div class="dash-label">Soil Temp</div><div class="dash-val orange" id="dTemp">0.0 °C</div></div></div>
  <div class="dash-card"><div class="dash-icon">💦</div><div><div class="dash-label">Soil Moisture</div><div class="dash-val blue" id="dMoist">0%</div></div></div>
  <div class="dash-card"><div class="dash-icon">⚡</div><div><div class="dash-label">Pressure</div><div class="dash-val" id="dPres">0.0 bar</div></div></div>
</div>

<div class="panel">
  <button class="btn btn-start" id="btnStart" onclick="toggleSystem()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    Start Irrigation
  </button>
  <button class="btn btn-stop" onclick="stopSystem()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
    Stop
  </button>
  <button class="btn btn-reset" onclick="resetSystem()">↺ Reset</button>
</div>

<div class="sim" id="sim">
  <img class="sim-img" id="bgImg" src="WhatsApp Image 2026-07-27 at 3.17.20 PM.jpeg" alt="GrowSphere FLEX" draggable="false">
  <svg class="overlay-svg" id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
/* ═══════════════════════════════════════════
   PRECISE COORDINATE MAPPING (% of 1536x1024)
   ═══════════════════════════════════════════ */

const RAIL_Y = 42.5;
const TUBE_TOP_Y = 44.5;
const TUBE_BOTTOM_Y = 73.5;

const VALVE_DATA = [
  { x:42.0, label:'Zone 1 — Tomato A',   on:true  },
  { x:46.4, label:'Zone 2 — Tomato B',   on:true  },
  { x:50.5, label:'Zone 3 — Pepper',     on:true  },
  { x:54.7, label:'Zone 4 — Tomato C',   on:false },
  { x:59.0, label:'Zone 5 — Bell Pepper',on:true  },
  { x:63.2, label:'Zone 6 — Capsicum',   on:true  },
  { x:67.5, label:'Zone 7 — Herbs',      on:true  },
  { x:71.8, label:'Zone 8 — Greens',     on:true  },
];

// The actual physical tubes sweep noticeably to the left from the valves!
// These match the exact X positions of the blue LEDs in the soil
const SOIL_LEDS = [
  41.0, 45.0, 49.0, 53.0, 57.0, 61.0, 65.0, 69.0
];

const TANKS = [
  { id:'N',  x:22.5, topY:62.5, botY:70.5, color:'#00ff6a' },
  { id:'P',  x:26.8, topY:62.5, botY:70.5, color:'#00bbff' },
  { id:'K',  x:31.0, topY:62.5, botY:70.5, color:'#ffaa00' },
  { id:'pH', x:35.2, topY:62.5, botY:70.5, color:'#c96dff' },
];

const PUMP = {x:16.0, y:78.5};
const ANTENNA = {x:76.8, y:3.5}; // Red tip above solar panel

/* ════════════════════ STATE ════════════════════ */
let running = false;
let valveStates = VALVE_DATA.map(v => v.on);
let dashInterval = null;

/* ════════════════════ SIZING ════════════════════ */
const bgImg = document.getElementById('bgImg');
const svgEl = document.getElementById('svg');
let iw, ih, ix, iy;

function syncSize() {
  const cr = bgImg.getBoundingClientRect();
  const natW = 1536, natH = 1024;
  const scale = Math.min(cr.width / natW, cr.height / natH);
  iw = natW * scale;
  ih = natH * scale;
  ix = cr.left + (cr.width - iw) / 2;
  iy = cr.top + (cr.height - ih) / 2;

  svgEl.style.left   = ix + 'px';
  svgEl.style.top    = iy + 'px';
  svgEl.style.width  = iw + 'px';
  svgEl.style.height = ih + 'px';
  svgEl.setAttribute('viewBox', `0 0 1536 1024`);
}

window.addEventListener('resize', () => { syncSize(); buildSVG(); });
bgImg.addEventListener('load', () => { syncSize(); buildSVG(); });
if (bgImg.complete) { syncSize(); buildSVG(); }

/* ════════════════════ SVG BUILD ════════════════════ */
function X(pctX) { return (pctX / 100) * 1536; }
function Y(pctY) { return (pctY / 100) * 1024; }

function buildSVG() {
  let svg = `<defs>
    <filter id="glowBlue" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowTank" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

  if (running) {
    // ── Precise Main Pipe Path ──
    // Path 1: Blue Tank to Pump
    const p1 = `M ${X(9.0)},${Y(68.0)} L ${X(9.0)},${Y(75.8)} L ${X(13.0)},${Y(75.8)}`;
    // Path 2: Pump out to Rail
    const p2 = `M ${X(19.0)},${Y(75.8)} L ${X(37.5)},${Y(75.8)} L ${X(37.5)},${Y(53.0)} Q ${X(37.5)},${Y(45.0)} ${X(40.5)},${Y(42.5)} L ${X(74.0)},${Y(42.5)}`;

    svg += `<path d="${p1} ${p2}" fill="none" stroke="#0af" stroke-width="6" stroke-linecap="round" opacity="0.45" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>`;
  }

  // Tanks
  TANKS.forEach(t => {
    const cx = X(t.x), ty = Y(t.topY), by = Y(t.botY);
    const tankH = by - ty;
    const fillH = running ? tankH * (0.35 + Math.random()*0.5) : 0;
    const fy = by - fillH;
    
    if (running) {
      svg += `<rect x="${cx-16}" y="${fy}" width="32" height="${fillH}" rx="3" fill="${t.color}" opacity="0.3" filter="url(#glowTank)"/>`;
      svg += `<rect x="${cx-12}" y="${fy}" width="24" height="${fillH}" rx="2" fill="${t.color}" opacity="0.4"/>`;
      // Bubbles
      for(let b=0; b<4; b++){
        const bx = cx - 8 + Math.random()*16;
        const dur = 1 + Math.random()*2;
        const delay = Math.random()*2;
        svg += `<circle cx="${bx}" fill="${t.color}" style="--ty:${fy}px; --by:${by-4}px;">
          <animate attributeName="cy" values="${by-4};${fy}" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/>
          <animate attributeName="r" values="1;2.5" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/>
        </circle>`;
      }
    }
  });

  // Valves and Drip Tubes (with precise S-curve to match leftward physical sweep)
  VALVE_DATA.forEach((v, i) => {
    const vx = X(v.x);
    const ledX = X(SOIL_LEDS[i]); // Noticeably to the left of vx!
    const vy1 = Y(TUBE_TOP_Y);
    const vy2 = Y(TUBE_BOTTOM_Y);
    
    // Natural hanging tube curve using Cubic Bezier
    // Down from the valve, up from the LED
    const pathD = `M ${vx},${vy1} C ${vx},${vy1 + Y(10)} ${ledX},${vy2 - Y(10)} ${ledX},${vy2}`;
    
    const active = running && valveStates[i];

    if (active) {
      // Tube Glow
      svg += `<path d="${pathD}" fill="none" stroke="#00bbff" stroke-width="7" stroke-linecap="round" opacity="0.4" filter="url(#glowBlue)"/>`;
      svg += `<path d="${pathD}" fill="none" stroke="#88eeff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>`;

      // Flow dashes follow the curve
      svg += `<path d="${pathD}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 14">
        <animate attributeName="stroke-dashoffset" from="-18" to="0" dur="0.4s" repeatCount="indefinite"/>
      </path>`;

      // Soil LED
      svg += `<circle cx="${ledX}" cy="${vy2}" r="20" fill="#00bbff" opacity="0.15" filter="url(#glowSoft)">
        <animate attributeName="opacity" values=".1;.3;.1" dur="2s" begin="${i*0.2}s" repeatCount="indefinite"/>
      </circle>`;
      svg += `<circle cx="${ledX}" cy="${vy2}" r="6" fill="#44ddff" opacity="0.9" filter="url(#glowBlue)">
        <animate attributeName="opacity" values=".7;1;.7" dur="1.5s" begin="${i*0.15}s" repeatCount="indefinite"/>
      </circle>`;
      svg += `<circle cx="${ledX}" cy="${vy2}" r="2" fill="#fff" opacity="1">
        <animate attributeName="opacity" values=".8;1;.8" dur="1s" begin="${i*0.1}s" repeatCount="indefinite"/>
      </circle>`;
    }

    // Valve interaction
    const valveCy = Y(RAIL_Y) - 10;
    svg += `<circle class="valve-ring" cx="${vx}" cy="${valveCy}" r="12" fill="none" stroke="${active ? '#00d97e' : '#ff4757'}" stroke-width="2" opacity="${active ? 0.8 : 0.4}"/>`;
    svg += `<circle cx="${vx}" cy="${valveCy}" r="4" fill="${active ? '#00d97e' : '#ff4757'}" opacity="${active ? 1 : 0.6}" ${active ? 'filter="url(#glowBlue)"' : ''}>
      ${active ? '<animate attributeName="opacity" values="1;.5;1" dur="1.2s" repeatCount="indefinite"/>' : ''}
    </circle>`;
    svg += `<g class="valve-hit" onclick="toggleValve(${i})" onmouseenter="showTip(event,${i})" onmouseleave="hideTip()">
      <circle cx="${vx}" cy="${valveCy}" r="20" fill="transparent"/>
    </g>`;
  });

  // Pump & Antenna
  if (running) {
    const px = X(PUMP.x), py = Y(PUMP.y);
    svg += `<circle cx="${px}" cy="${py}" r="5" fill="#00d97e" filter="url(#glowTank)">
      <animate attributeName="opacity" values="1;.4;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>`;

    const ax = X(ANTENNA.x), ay = Y(ANTENNA.y);
    for(let w=0; w<3; w++) {
      svg += `<circle cx="${ax}" cy="${ay}" fill="none" stroke="#ff4757" opacity="0">
        <animate attributeName="r" values="2;45" dur="2.5s" begin="${w*0.8}s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="2.5s" begin="${w*0.8}s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="3;0.5" dur="2.5s" begin="${w*0.8}s" repeatCount="indefinite"/>
      </circle>`;
    }

    // Controller screen glow
    svg += `<rect x="${X(74)}" y="${Y(23)}" width="${X(4)}" height="${Y(12)}" rx="4" fill="#00d97e" opacity="0.08" filter="url(#glowSoft)">
      <animate attributeName="opacity" values=".05;.15;.05" dur="3s" repeatCount="indefinite"/>
    </rect>`;
  }

  svgEl.innerHTML = svg;
}

/* ════════════════════ INTERACTION ════════════════════ */
function toggleValve(i) { valveStates[i] = !valveStates[i]; buildSVG(); }

const tooltip = document.getElementById('tooltip');
function showTip(e, i) {
  const active = running && valveStates[i];
  tooltip.innerHTML = `<span style="color:${active?'#00d97e':'#ff4757'}">●</span> ${VALVE_DATA[i].label} — ${active?'ACTIVE':'CLOSED'}`;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style.left = (e.clientX + 16) + 'px';
  tooltip.style.top  = (e.clientY - 12) + 'px';
}
function hideTip() { tooltip.style.opacity = 0; }
document.addEventListener('mousemove', e => { if(tooltip.style.opacity==='1') moveTooltip(e); });

function toggleSystem() { running ? stopSystem() : startSystem(); }

function startSystem() {
  running = true;
  document.getElementById('btnStart').classList.add('running');
  document.getElementById('btnStart').innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg> System Running`;
  document.getElementById('badge').classList.add('active');
  document.getElementById('badgeTxt').textContent = 'Irrigation Active';
  document.getElementById('dash').classList.add('show');
  buildSVG();
  startDashboard();
}

function stopSystem() {
  running = false;
  document.getElementById('btnStart').classList.remove('running');
  document.getElementById('btnStart').innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Start Irrigation`;
  document.getElementById('badge').classList.remove('active');
  document.getElementById('badgeTxt').textContent = 'System Idle';
  document.getElementById('dash').classList.remove('show');
  if(dashInterval) clearInterval(dashInterval);
  buildSVG();
}

function resetSystem() { stopSystem(); valveStates = VALVE_DATA.map(v => v.on); buildSVG(); }

/* ════════════════════ DASHBOARD ════════════════════ */
function startDashboard() {
  updateDash();
  dashInterval = setInterval(updateDash, 2000);
}

function updateDash() {
  if (!running) return;
  const activeCount = valveStates.filter(v=>v).length;
  const flow = (activeCount * 2.3 + Math.random()*1.5).toFixed(1);
  const ec   = (1.4 + Math.random()*0.8).toFixed(2);
  const ph   = (6.0 + Math.random()*0.8).toFixed(1);
  const temp = (22 + Math.random()*6).toFixed(1);
  const moist= Math.floor(55 + Math.random()*30);
  const pres = (1.8 + Math.random()*0.6).toFixed(1);

  animVal('dFlow',  flow + ' L/min');
  animVal('dEC',    ec + ' mS/cm');
  animVal('dPH',    ph);
  animVal('dTemp',  temp + ' °C');
  animVal('dMoist', moist + '%');
  animVal('dPres',  pres + ' bar');
}

function animVal(id, newVal) {
  const el = document.getElementById(id);
  el.style.transition = 'opacity .2s';
  el.style.opacity = 0.2;
  setTimeout(() => { el.textContent = newVal; el.style.opacity = 1; }, 200);
}
</script>
</body>
</html>
